services:
  postgres:
    image: postgres:16
    container_name: easyrent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: easyrent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - easyrent_pgdata:/var/lib/postgresql/data
volumes:
  easyrent_pgdata:
